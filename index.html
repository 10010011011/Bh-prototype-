<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>Black Hole Combat — Gargantua System</title>
<link rel="stylesheet" href="style.css">

</head>
<body>
<canvas id="renderCanvas"></canvas>
<canvas id="overlayCanvas"></canvas>
<div id="damageVignette"></div>

<!-- Minimal Zero-Bloat Flight HUD: Only small Hamburger icon, Center Radar Disc, and Speed -->
<div id="topHud">
  <div class="top-cluster">
    <button id="menuBtn" title="Open Tactical Hamburger Menu (Esc / P)">≡</button>
  </div>

  <div id="centerTopHud">
    <div id="radarWrap" title="Tap to cycle radar range (1.5km / 4.5km / 18km) · Outer arcs show Shield &amp; Hull">
      <canvas id="radarCanvas" width="140" height="140"></canvas>
      <div id="radarRangeTag">1.5KM</div>
    </div>
  </div>

  <div class="top-cluster">
    <div id="speedHud" class="mono">0 m/s</div>
  </div>
</div>

<div id="alertBanner"></div>
<div id="diag"></div>
<div id="touchDebug"></div>

<!-- Game Controller: Upper-Left BOOST, Upper-Right FIRE, + Right Stick Ordnance Arc -->
<div id="combatButtons">
  <button id="flareBtn" class="act-btn" title="Deploy Countermeasure Flares (C)">
    <span class="ico">✦</span><span class="sub" id="flareCnt">6</span>
  </button>
  <button id="boostBtn" class="act-btn" title="Engage Sub-Light Afterburner (B)">
    <span class="ico">🔥</span><span class="sub">BOOST</span>
  </button>
  <button id="laserBtn" class="act-btn" title="Fire High-Energy Phase Laser (L)">
    <span class="ico">⚡</span><span class="sub" id="laserState">RDY</span>
  </button>
  <button id="missileBtn" class="act-btn" title="Launch APN Seeker Missile (M)">
    <span class="ico">🚀</span><span class="sub" id="mslCnt">8</span>
  </button>
  <button id="fireBtn" class="act-btn" title="Fire Twin Plasma Autocannons (Hold / Space / F)">
    <span class="ico">⊕</span><span class="sub">FIRE</span>
  </button>
</div>

<!-- Compact Docked Hamburger Menu Drawer with Organized Tabs -->
<div id="dpadH"></div><div id="dpadV"></div>
<button id="miniMapBtn" aria-label="Open system map"><canvas width="76" height="76"></canvas></button>
<div id="tacticalModal">
  <div class="modal-hdr">
    <div class="modal-top-row">
      <div class="modal-title">Menu</div>
      <button id="resumeBtn" class="resume-btn">Close</button>
    </div>

    <!-- Organized Navigation Tabs -->
    <div class="tab-bar" id="modalTabs">
      <button class="tab-btn active" data-tab="shop">Visor and shop</button>
      <button class="tab-btn" data-tab="map">System map</button>
      <button class="tab-btn" data-tab="weapons">Weapons</button>
      <button class="tab-btn" data-tab="missions">Missions</button>
      <button class="tab-btn" data-tab="telemetry">Telemetry</button>
      <button class="tab-btn" data-tab="settings">Flight and assist</button>
      <button class="tab-btn" data-tab="controls">Controls</button>
    </div>
  </div>

  <!-- Spacious Scrollable Tab Body + Status/Warp Controls -->
  <div class="modal-scroll-area">
    <div class="modal-body" id="modalContent"></div>

    <!-- Quick Status & Toggle Strip inside Hamburger Menu -->
    <div class="drawer-status-strip">
      <div id="sectorPill" class="hud-pill" title="Open 8-Sector System Map">
        <span id="sectorDot"></span>
        <span id="sectorText">PHOTON REACH · 30.0 Rs</span>
      </div>
      <div id="waveBanner">W1/5 · 600 CR</div>
      <button id="lockBtn" class="hud-pill active" title="Toggle Smart Auto-Target Lock (G)">🎯 LOCK: ON</button>
      <button id="filterBtn" class="hud-pill amber" title="Cycle Accretion Disk Visor Filter (V)">🕶️ ND-8 FILM</button>
      <button id="holdBtn" class="hud-pill active" title="Toggle Attitude Hold Mode (H)">HOLD: ORBIT</button>
      <button id="sideMenuBtn" class="hud-pill" title="Toggle Quick Assist Drawer">⚙ ASSIST</button>
      <button id="muteBtn" class="hud-pill" title="Toggle Cockpit Audio">🔊</button>
      <button id="diagBtn" class="mono">...</button>
    </div>

    <!-- Collapsible Quick Assist Sub-Panel -->
    <div id="sideDrawer">
      <div class="side-hdr">
        <span>⚡ QUICK FLIGHT &amp; OPTICS</span>
        <span id="sideCredits">600 CR</span>
      </div>
      <div class="side-row">
        <span>Auto Target Lock</span>
        <button id="sideLockBtn" class="side-toggle on">ON (19°)</button>
      </div>
      <div class="side-row">
        <span>Auto-Fire Cannon</span>
        <button id="autoFireBtn" class="side-toggle on">AUTO: ON</button>
      </div>
      <div class="side-row">
        <span>Accretion Visor</span>
        <button id="sideFilterBtn" class="side-toggle amber">ND-8 FILM</button>
      </div>
      <div class="side-row">
        <span>Dynamic Gravity</span>
        <button id="sideGravBtn" class="side-toggle on">REAL WELL</button>
      </div>
      <div class="side-row">
        <span>Attitude Frame</span>
        <button id="sideHoldBtn" class="side-toggle on">ORBIT HOLD</button>
      </div>
      <button id="openShopBtn" class="btn-action" style="width:100%; margin:2px 0 0 0;">🛒 VIEW VISOR &amp; UPGRADE SHOP</button>
    </div>

    <!-- Ship Vitals & Quick Sector Warp Bar -->
    <div id="bottomCenterHud">
      <div class="bars-row">
        <div class="bar-box">
          <div class="bar-lbl"><span>SHIELD</span><span id="shieldTxt">150</span></div>
          <div class="bar-track"><div id="shieldFill" class="bar-fill"></div></div>
        </div>
        <div class="bar-box">
          <div class="bar-lbl"><span>HULL</span><span id="hullTxt">120</span></div>
          <div class="bar-track"><div id="hullFill" class="bar-fill"></div></div>
        </div>
        <div class="bar-box">
          <div class="bar-lbl"><span>THERMAL</span><span id="heatTxt">0%</span></div>
          <div class="bar-track"><div id="heatFill" class="bar-fill"></div></div>
        </div>
      </div>
      <div class="warp-row">
        <button id="prevSecBtn" class="nav-btn" title="Previous Orbital Sector">&lt;</button>
        <span id="navTargetLabel">DEST: CINDER (14.0 Rs)</span>
        <button id="nextSecBtn" class="nav-btn" title="Next Orbital Sector">&gt;</button>
        <button id="warpBtn" class="nav-btn warp-go" title="Engage Alcubierre FTL Warp (R)">⚡ WARP</button>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
<script src="perf.js"></script>
</body>
</html>
